services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3001:3001"  # API & Web UI (existing URL)
      - "8080:3001"   # Alternative Web UI port
    volumes:
      - db-data:/app/data  # Persist database in named volume
      - ./skills:/app/skills  # Live-edit team-scoping methodology without rebuild
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=file:/app/data/dev.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/api/projects"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  db-data:
    driver: local

