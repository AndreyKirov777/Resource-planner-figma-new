services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "80:3001"  # Map VM's port 80 to container's port 3001
      - "3001:3001"  # Also expose 3001 directly for API access
    volumes:
      - db-data:/app/prisma  # Persist database in named volume
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=file:./prisma/dev.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/api/projects"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  db-data:
    driver: local

