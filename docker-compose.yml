services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3001:3001"  # API & Web UI (existing URL)
      - "8080:3001"   # Alternative Web UI port
    volumes:
      - db-data:/app/data  # Persist database in named volume
      - ./skills:/app/skills  # Live-edit team-scoping methodology without rebuild
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=file:/app/data/dev.db?connection_limit=1
      - AUTH_MODE=${AUTH_MODE:-entra}
      - ENTRA_TENANT_ID=${ENTRA_TENANT_ID}
      - ENTRA_CLIENT_ID=${ENTRA_CLIENT_ID}
      - ENTRA_CLIENT_SECRET=${ENTRA_CLIENT_SECRET}
      - ENTRA_REDIRECT_URI=${ENTRA_REDIRECT_URI}
      - ENTRA_GROUP_ADMIN=${ENTRA_GROUP_ADMIN}
      - ENTRA_GROUP_MANAGER=${ENTRA_GROUP_MANAGER}
      - ENTRA_GROUP_USER=${ENTRA_GROUP_USER}
      - ADMIN_EMAILS=${ADMIN_EMAILS}
      - SESSION_SECRET=${SESSION_SECRET}
      - COOKIE_SECURE=${COOKIE_SECURE:-true}
      - TRUST_PROXY=${TRUST_PROXY:-1}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  caddy:
    image: caddy:2-alpine
    profiles: ["tls"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - SITE_ADDRESS=${SITE_ADDRESS:-marenas-aiagent-vm.ipa.dataart.net}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/etc/caddy/certs:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy

volumes:
  db-data:
    driver: local
  caddy-data:
    driver: local
  caddy-config:
    driver: local

